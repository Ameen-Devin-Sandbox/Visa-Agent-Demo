[project]
name = "visa-disputes-agent"
version = "0.1.0"
description = "Autonomous AI agent system for processing Visa disputes according to Visa Core Rules"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "anthropic>=0.40",
    "openai>=1.50",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
visa-agent = "src.main:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Long lines in system prompts and rule descriptions are expected

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
